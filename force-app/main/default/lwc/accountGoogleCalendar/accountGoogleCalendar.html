<template>
    <lightning-card title="Google Calendar Meetings" icon-name="standard:event" class="calendar-card">
        <!-- Card Actions Header -->
        <div slot="actions" class="slds-grid slds-grid_vertical-align-center slds-gutters_x-small">
            <template lwc:if={isSubscribed}>
                <div class="slds-col">
                    <span class="badge-connected" title="Real-time Platform Event sync is active">
                        <span class="realtime-indicator"></span> Live Sync
                    </span>
                </div>
            </template>
            <div class="slds-col">
                <lightning-button-icon 
                    icon-name="utility:refresh" 
                    variant="border-filled" 
                    alternative-text="Refresh Calendar" 
                    title="Refresh"
                    onclick={handleRefresh}
                    disabled={isLoading}>
                </lightning-button-icon>
            </div>
            <div class="slds-col">
                <lightning-button 
                    label="Schedule Meeting" 
                    variant="brand" 
                    icon-name="utility:add" 
                    onclick={openScheduleModal}
                    disabled={isLoading}>
                </lightning-button>
            </div>
        </div>

        <!-- Spinner -->
        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="Loading meetings..." size="medium"></lightning-spinner>
        </template>

        <!-- Body Content -->
        <div class="slds-p-around_medium">
            <!-- Configuration Banner if needed -->
            <template lwc:if={showConfigWarning}>
                <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_medium" role="alert">
                    <span class="slds-icon_container slds-m-right_x-small" title="Warning">
                        <lightning-icon icon-name="utility:warning" size="x-small" variant="inverse"></lightning-icon>
                    </span>
                    <h2>Google Calendar integration is not fully configured in Custom Metadata. Please check Google Calendar Setting.</h2>
                </div>
            </template>

            <!-- Meetings List -->
            <template lwc:if={hasMeetings}>
                <div class="slds-table--header-fixed_container">
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_fixed-layout">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col" style="width: 28%;">
                                    <div class="slds-truncate" title="Meeting">Meeting / Subject</div>
                                </th>
                                <th scope="col" style="width: 24%;">
                                    <div class="slds-truncate" title="Date & Time">Date & Time</div>
                                </th>
                                <th scope="col" style="width: 18%;">
                                    <div class="slds-truncate" title="Contact / Attendee">Attendee</div>
                                </th>
                                <th scope="col" style="width: 16%;">
                                    <div class="slds-truncate" title="Google Meet">Video Call</div>
                                </th>
                                <th scope="col" style="width: 14%;">
                                    <div class="slds-truncate" title="Actions">Actions</div>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={meetings} for:item="meeting">
                                <tr key={meeting.id} class="meeting-row">
                                    <td>
                                        <div class="slds-truncate font-weight-bold" title={meeting.subject}>
                                            <strong>{meeting.subject}</strong>
                                        </div>
                                        <template lwc:if={meeting.description}>
                                            <div class="slds-truncate slds-text-color_weak slds-text-body_small" title={meeting.description}>
                                                {meeting.description}
                                            </div>
                                        </template>
                                    </td>
                                    <td>
                                        <div class="slds-text-body_small">
                                            <lightning-formatted-date-time 
                                                value={meeting.startDateTime} 
                                                year="numeric" month="short" day="numeric" 
                                                hour="2-digit" minute="2-digit">
                                            </lightning-formatted-date-time>
                                            <span class="slds-m-horizontal_xx-small">-</span>
                                            <lightning-formatted-date-time 
                                                value={meeting.endDateTime} 
                                                hour="2-digit" minute="2-digit">
                                            </lightning-formatted-date-time>
                                        </div>
                                        <div>
                                            <span class="badge-sync">{meeting.syncStatus}</span>
                                        </div>
                                    </td>
                                    <td>
                                        <div class="slds-truncate" title={meeting.contactName}>
                                            <template lwc:if={meeting.contactName}>
                                                <lightning-icon icon-name="standard:contact" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                                <span>{meeting.contactName}</span>
                                            </template>
                                            <template lwc:else>
                                                <span class="slds-text-color_weak">-</span>
                                            </template>
                                        </div>
                                        <template lwc:if={meeting.contactEmail}>
                                            <div class="slds-text-color_weak slds-text-body_small slds-truncate">
                                                {meeting.contactEmail}
                                            </div>
                                        </template>
                                    </td>
                                    <td>
                                        <template lwc:if={meeting.googleMeetLink}>
                                            <a href={meeting.googleMeetLink} target="_blank" rel="noopener noreferrer" class="meet-btn">
                                                <lightning-icon icon-name="utility:video" size="xx-small" variant="inverse"></lightning-icon>
                                                Join Meet
                                            </a>
                                        </template>
                                        <template lwc:else>
                                            <span class="slds-text-color_weak slds-text-body_small">No video link</span>
                                        </template>
                                    </td>
                                    <td>
                                        <div class="slds-button-group" role="group">
                                            <lightning-button-icon 
                                                icon-name="utility:clock" 
                                                size="small" 
                                                variant="border-filled" 
                                                alternative-text="Reschedule" 
                                                title="Reschedule / Shift Time" 
                                                data-id={meeting.id}
                                                onclick={openRescheduleModal}>
                                            </lightning-button-icon>
                                            <lightning-button-icon 
                                                icon-name="utility:delete" 
                                                size="small" 
                                                variant="border-filled" 
                                                alternative-text="Cancel Meeting" 
                                                title="Cancel Meeting" 
                                                data-id={meeting.id}
                                                onclick={openCancelConfirmModal}>
                                            </lightning-button-icon>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>

            <!-- Empty State -->
            <template lwc:if={isEmpty}>
                <div class="empty-state">
                    <lightning-icon icon-name="utility:event" size="large" class="slds-m-bottom_small"></lightning-icon>
                    <h3 class="slds-text-heading_small slds-m-bottom_xx-small">No Upcoming Meetings</h3>
                    <p class="slds-text-body_regular slds-m-bottom_medium">
                        Schedule a meeting with Account contacts to sync in real-time with Google Calendar.
                    </p>
                    <lightning-button 
                        label="Schedule First Meeting" 
                        variant="brand" 
                        icon-name="utility:add" 
                        onclick={openScheduleModal}>
                    </lightning-button>
                </div>
            </template>
        </div>
    </lightning-card>

    <!-- SCHEDULE MEETING MODAL -->
    <template lwc:if={isScheduleModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_medium" aria-modal="true">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeScheduleModal}>
                        <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-modal__title slds-hyphenate">Schedule Google Calendar Meeting</h2>
                    <p class="slds-m-top_x-small slds-text-body_small">
                        Creates an event on Google Calendar, invites attendees, generates Google Meet, and records to Salesforce.
                    </p>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <template lwc:if={isModalLoading}>
                        <lightning-spinner alternative-text="Saving..." size="medium"></lightning-spinner>
                    </template>

                    <div class="slds-form slds-form_stacked">
                        <!-- Subject -->
                        <lightning-input 
                            label="Meeting Subject" 
                            name="subject" 
                            value={scheduleForm.subject} 
                            onchange={handleScheduleInputChange} 
                            required>
                        </lightning-input>

                        <!-- Contact Dropdown -->
                        <lightning-combobox
                            name="contactId"
                            label="Primary Contact (Account Attendee)"
                            value={scheduleForm.contactId}
                            placeholder="Select Contact"
                            options={contactOptions}
                            onchange={handleContactChange}
                            class="slds-m-top_small">
                        </lightning-combobox>

                        <!-- Additional Attendee Emails -->
                        <lightning-input 
                            label="Additional Attendee Emails (comma separated)" 
                            name="additionalEmails" 
                            value={scheduleForm.additionalEmails} 
                            placeholder="colleague@example.com, client@partner.com"
                            onchange={handleScheduleInputChange}
                            class="slds-m-top_small">
                        </lightning-input>

                        <!-- Date & Time Row -->
                        <div class="slds-grid slds-gutters slds-m-top_small">
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input 
                                    type="datetime" 
                                    name="startDateTime" 
                                    label="Start Date & Time" 
                                    value={scheduleForm.startDateTime} 
                                    onchange={handleScheduleInputChange} 
                                    required>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input 
                                    type="datetime" 
                                    name="endDateTime" 
                                    label="End Date & Time" 
                                    value={scheduleForm.endDateTime} 
                                    onchange={handleScheduleInputChange} 
                                    required>
                                </lightning-input>
                            </div>
                        </div>

                        <!-- Google Meet Toggle -->
                        <div class="slds-m-top_medium">
                            <lightning-input 
                                type="toggle" 
                                label="Generate Google Meet video call link" 
                                name="addGoogleMeet" 
                                checked={scheduleForm.addGoogleMeet} 
                                onchange={handleScheduleInputChange}
                                message-toggle-active="Enabled"
                                message-toggle-inactive="Disabled">
                            </lightning-input>
                        </div>

                        <!-- Agenda / Description -->
                        <lightning-textarea 
                            label="Agenda / Description" 
                            name="description" 
                            value={scheduleForm.description} 
                            placeholder="Outline key discussion topics, links, or agenda..."
                            onchange={handleScheduleInputChange}
                            class="slds-m-top_small">
                        </lightning-textarea>
                    </div>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeScheduleModal} class="slds-m-right_x-small"></lightning-button>
                    <lightning-button label="Schedule & Sync" variant="brand" icon-name="utility:send" onclick={handleScheduleSubmit} disabled={isModalLoading}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- RESCHEDULE MODAL -->
    <template lwc:if={isRescheduleModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open" aria-modal="true">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeRescheduleModal}>
                        <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-modal__title slds-hyphenate">Reschedule Meeting</h2>
                    <p class="slds-m-top_x-small slds-text-body_small">
                        <strong>{selectedMeeting.subject}</strong>
                    </p>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <template lwc:if={isModalLoading}>
                        <lightning-spinner alternative-text="Updating..." size="medium"></lightning-spinner>
                    </template>

                    <div class="slds-form slds-form_stacked">
                        <lightning-input 
                            type="datetime" 
                            name="newStartDateTime" 
                            label="New Start Date & Time" 
                            value={rescheduleForm.startDateTime} 
                            onchange={handleRescheduleStartChange} 
                            required>
                        </lightning-input>

                        <lightning-input 
                            type="datetime" 
                            name="newEndDateTime" 
                            label="New End Date & Time" 
                            value={rescheduleForm.endDateTime} 
                            onchange={handleRescheduleEndChange} 
                            class="slds-m-top_small"
                            required>
                        </lightning-input>
                    </div>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeRescheduleModal} class="slds-m-right_x-small"></lightning-button>
                    <lightning-button label="Confirm Reschedule" variant="brand" icon-name="utility:clock" onclick={handleRescheduleSubmit} disabled={isModalLoading}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- CANCEL CONFIRMATION MODAL -->
    <template lwc:if={isCancelModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_prompt" aria-modal="true">
            <div class="slds-modal__container">
                <header class="slds-modal__header slds-theme_error slds-theme_alert-texture">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeCancelModal}>
                        <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-modal__title slds-hyphenate">Cancel Google Calendar Meeting</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <template lwc:if={isModalLoading}>
                        <lightning-spinner alternative-text="Canceling..." size="medium"></lightning-spinner>
                    </template>
                    <p>Are you sure you want to cancel the meeting <strong>"{selectedMeeting.subject}"</strong>?</p>
                    <p class="slds-m-top_x-small slds-text-color_weak slds-text-body_small">
                        This will permanently delete the event from Google Calendar and notify all attendees.
                    </p>
                </div>

                <footer class="slds-modal__footer slds-theme_default">
                    <lightning-button label="Keep Meeting" onclick={closeCancelModal} class="slds-m-right_x-small"></lightning-button>
                    <lightning-button label="Yes, Cancel Meeting" variant="destructive" icon-name="utility:delete" onclick={handleCancelSubmit} disabled={isModalLoading}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
