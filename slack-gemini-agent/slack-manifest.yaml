display_information:
  name: Gemini Agent
  description: Autonomous enterprise AI assistant powered by Google AI Studio
  background_color: "#1a73e8"
features:
  bot_user:
    display_name: Gemini
    always_online: true
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - groups:history
      - im:history
      - im:read
      - im:write
      - reactions:write
settings:
  socket_mode_enabled: true
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
