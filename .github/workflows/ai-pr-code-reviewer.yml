name: "AI PR Code Reviewer Agent"

on:
  workflow_dispatch:
    inputs:
      prNumber:
        description: "Pull Request Number"
        required: true
      ticketKey:
        description: "JIRA Ticket Key"
        required: false
        default: ""
      callbackUrl:
        description: "Orchestrator Webhook Callback URL"
        required: false
        default: ""
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'force-app/**'

jobs:
  code-review:
    name: "Salesforce Code Review & Best Practices"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run AI Code Reviewer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.prNumber || github.event.pull_request.number }}
          TICKET_KEY: ${{ github.event.inputs.ticketKey || '' }}
          CALLBACK_URL: ${{ github.event.inputs.callbackUrl || '' }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          node .github/scripts/run-ai-review.js
